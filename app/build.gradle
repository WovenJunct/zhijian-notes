plugins { id 'com.android.application' }
android {
    namespace 'app.zhijian.notes'
    compileSdk 36
    defaultConfig {
        applicationId 'app.zhijian.notes'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            def propsFile = rootProject.file('.signing/signing.properties')
            if (propsFile.exists()) {
                def p = new Properties(); propsFile.withInputStream { p.load(it) }
                storeFile rootProject.file('.signing/zhijian.jks')
                storePassword p['storePassword']; keyAlias 'zhijian'; keyPassword p['keyPassword']
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = false }
    lint { abortOnError true }
}
dependencies {
    implementation 'org.commonmark:commonmark:0.21.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
